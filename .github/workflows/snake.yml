name: Generate Snake Contribution Animation

on:
  # Daily cron schedule at midnight (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  
  # Trigger on push to main branch
  push:
    branches:
      - main
      
  # Allows manual triggering anytime from GitHub Actions tab
  workflow_dispatch:

# Ensure workflow can write to repository branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Snake Animation (Zesty Lemon Palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFFF66&color_dots=#0D1117,#D6D58B,#B3B347,#FFE566,#FFFF66
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFFF66&color_dots=#0D1117,#D6D58B,#B3B347,#FFE566,#FFFF66

      - name: Deploy Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
